# --------------------------------------------------------------------------
# 炼金窗口 —— 右侧列表类型切换按钮的悬浮提示
# --------------------------------------------------------------------------

AlchemyWindow_Type_Ingredient_Tooltip: |-
  可用素材列表。
  点击素材可将其加入（或移出）配方。

AlchemyWindow_Type_Effect_Tooltip: |-
  可用效果列表。
  点击效果可将其设为筛选条件。
  按住 {color_header}SHIFT{color_normal} 或 {color_header}LT{color_normal} 可多选效果。
  按住 {color_header}CTRL{color_normal} 或 {color_header}RT{color_normal} 可把效果标记为收藏。

AlchemyWindow_Toggle_Matching_Ingredient_Tooltip: |-
  启用后，只显示「含有已选素材中尚未匹配的效果」的素材。

AlchemyWindow_Toggle_Matching_Effect_Tooltip: |-
  启用后，酿造药水时只显示正面效果。
  酿造毒药时只显示有害效果。


