# ==========================================================================
# Alchemy Redone —— 简体中文翻译
#
# 原文件：  l10n/TPA_AlchemyRedone/en.yaml  （共 118 个键）
# 对应模组： (OpenMW) Alchemy Redone v1.4.2
#
# 【翻译须知 —— 改动前务必阅读】
# 1. 形如 {color_header} {color_normal} {color_positive} {color_negative}
#    {count} {min} {max} {default} {apparatus} 的占位符必须【原样保留】，
#    不能翻译、不能改名、不能删除。它们是运行时填充的变量和颜色标记。
# 2. 冒号左边的键名【不要改动】，改了会导致对应的文本变成空白。
# 3. 以 |- 开头的多行文本，内容必须保持 2 个空格缩进，空行也要保持缩进或完全空着。
# 4. 值里如果出现【半角冒号+空格】（": "），必须用引号包起来，否则 YAML 解析失败。
#    本文档中的中文冒号「：」是全角字符，不会触发这个问题。
# ==========================================================================


